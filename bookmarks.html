<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回答・数式のブックマーク</title>
  <link rel="stylesheet" href="bookmarks.css">
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="preview-core.js" defer></script>
  <script src="bookmarks-core.js" defer></script>
  <script src="bookmarks.js" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">TeX Symbol Input for ChatGPT</p><h1>回答・数式のブックマーク</h1></div>
      <div class="backup"><button id="export" type="button">バックアップ</button><button id="import" type="button">復元</button><input id="import-file" type="file" accept="application/json,.json" hidden></div>
    </header>
    <p class="intro">残しておきたい回答と数式を、いつでも手元に。</p>
    <div class="filters"><input id="search" type="search" placeholder="名前・本文・TeXで検索" aria-label="ブックマークを検索"><select id="kind" aria-label="種類で絞り込む"><option value="all">すべて</option><option value="answer">回答</option><option value="formula">数式</option></select></div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="count" class="muted"></p>
    <div id="list"></div>
    <p id="empty" hidden>まだブックマークはありません。ChatGPTの回答の下にある「回答を保存」「数式を保存」から追加できます。</p>
    <footer>このブラウザのプロファイル内に保存します。クラウド同期はありません。拡張の削除前にバックアップしてください。<br>独自コード・ドキュメントは、ユーザーの指示に基づきOpenAIのGPT（ChatGPT／Codex）が生成しました。</footer>
  </main>
</body>
</html>
